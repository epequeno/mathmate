<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; min-height: 320px; background: #fff; position: relative; }
  #board { width: 100%; height: 320px; min-height: 280px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; }

  .widget-error {
    display: flex; align-items: center; justify-content: center;
    height: 100%; font-family: -apple-system, sans-serif;
    color: #888; font-size: 13px; text-align: center; padding: 20px;
  }
</style>
<!-- JSXGraph loaded from local bundle; if absent the shell shows an error -->
<link rel="stylesheet" href="jsxgraph.css">
<script src="jsxgraph.min.js"></script>
</head>
<body>
<div id="board" class="jxgbox"><div class="widget-error" id="error-msg">Loading widget…</div></div>

<script>
(function() {
  var board = null;

  function reportHeight() {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.resizeWidget) {
      var boardEl = document.getElementById('board');
      var h = boardEl ? boardEl.getBoundingClientRect().height : 320;
      h = Math.max(220, Math.min(520, h));
      window.webkit.messageHandlers.resizeWidget.postMessage(String(h));
    }
  }

  window.loadWidget = function(spec) {
    var container = document.getElementById('board');

    // Check JSXGraph loaded
    if (typeof JXG === 'undefined') {
      container.innerHTML = '<div class="widget-error">JSXGraph library not found.<br>Add js/jsxgraph.min.js to the widget bundle.</div>';
      reportHeight();
      return;
    }

    // Clear previous board
    if (board) {
      JXG.JSXFree(board);
      board = null;
    }
    container.innerHTML = '';

    var title = spec.title || 'Interactive Widget';
    var config = spec.config && spec.config.raw ? spec.config.raw : {};

    switch (spec.type) {
      case 'graph':
        renderGraph(container, config, title);
        break;
      case 'geometry':
        renderGeometry(container, config, title);
        break;
      case 'numberline':
        renderNumberLine(container, config, title);
        break;
      default:
        container.innerHTML = '<div class="widget-error">Unknown widget type: ' + (spec.type || 'none') + '</div>';
    }

    reportHeight();
  };

  function renderGraph(container, config, title) {
    try {
      var bounds = parseBounds(config.bounds || '-10,10,10,-10');
      board = JXG.JSXGraph.initBoard(container.id, {
        boundingbox: bounds,
        axis: true,
        grid: true,
        showCopyright: false
      });

      if (config.type === 'quadratic' || config.function === 'quadratic') {
        var a = parseFloat(config.a) || 1;
        var b = parseFloat(config.b) || 0;
        var c = parseFloat(config.c) || 0;
        board.create('functiongraph', [function(x) { return a*x*x + b*x + c; }]);
      } else if (config.type === 'linear_with_sliders') {
        var mMin = parseFloat(config.mMin); if (isNaN(mMin)) mMin = -5;
        var mMax = parseFloat(config.mMax); if (isNaN(mMax)) mMax = 5;
        var bMin = parseFloat(config.bMin); if (isNaN(bMin)) bMin = -10;
        var bMax = parseFloat(config.bMax); if (isNaN(bMax)) bMax = 10;
        var mDefault = parseFloat(config.mDefault); if (isNaN(mDefault)) mDefault = 1;
        var bDefault = parseFloat(config.bDefault); if (isNaN(bDefault)) bDefault = 0;

        var mSlider = board.create('slider', [[bounds[0] + 1, bounds[1] - 1.2], [bounds[0] + 6, bounds[1] - 1.2], [mMin, mDefault, mMax]], {name: 'm'});
        var bSlider = board.create('slider', [[bounds[0] + 1, bounds[1] - 2.2], [bounds[0] + 6, bounds[1] - 2.2], [bMin, bDefault, bMax]], {name: 'b'});
        board.create('functiongraph', [function(x) { return mSlider.Value()*x + bSlider.Value(); }], {strokeWidth: 2, strokeColor: '#2563eb'});
        board.create('text', [bounds[0] + 6.8, bounds[1] - 1.7, function() {
          return 'y = ' + mSlider.Value().toFixed(2) + 'x + ' + bSlider.Value().toFixed(2);
        }], {fontSize: 12, color: '#111'});
      } else if (config.type === 'linear' || config.function === 'linear') {
        var m = parseFloat(config.m) || 1;
        var k = parseFloat(config.k) || 0;
        board.create('functiongraph', [function(x) { return m*x + k; }]);
      } else if (config.expression) {
        var fn = new Function('x', 'return ' + config.expression);
        board.create('functiongraph', [fn]);
      } else {
        board.create('functiongraph', [function(x) { return Math.sin(x); }]);
      }

      if (title) {
        board.create('text', [bounds[0] + 0.5, bounds[3] + 0.8, title], { fontSize: 12, color: '#333' });
      }

      if (window.ResizeObserver) {
        new ResizeObserver(reportHeight).observe(container);
      }

      setTimeout(function() {
        if (!container.querySelector('svg') && !container.querySelector('canvas')) {
          container.innerHTML = '<div class="widget-error">Widget rendered no visible canvas.</div>';
          reportHeight();
        }
      }, 200);
    } catch (e) {
      container.innerHTML = '<div class="widget-error">Widget render failed: ' + (e && e.message ? e.message : e) + '</div>';
      reportHeight();
    }
  }

  function renderGeometry(container, config, title) {
    var bounds = parseBounds(config.bounds || '-5,5,-5,5');
    board = JXG.JSXGraph.initBoard(container.id, {
      boundingbox: bounds,
      axis: true,
      grid: true,
      showCopyright: false
    });

    // If points are provided, render them
    if (config.points) {
      try {
        var pts = JSON.parse(config.points);
        pts.forEach(function(p) {
          board.create('point', [p[0], p[1]], { size: 3, color: '#0074D9' });
        });
      } catch(e) {}
    }

    if (title && board) {
      board.create('text', [bounds[0] + 0.3, bounds[2] - 0.3, title], { fontSize: 12, color: '#555' });
    }

    if (window.ResizeObserver) {
      new ResizeObserver(reportHeight).observe(container);
    }
  }

  function renderNumberLine(container, config, title) {
    var min = parseFloat(config.min) || -5;
    var max = parseFloat(config.max) || 5;
    var step = parseFloat(config.step) || 1;
    var highlightValues = config.highlight ? config.highlight.split(',').map(Number) : [];

    container.innerHTML = '<div id="nl-board" style="padding:16px;"></div>';
    var nlBoard = JXG.JSXGraph.initBoard('nl-board', {
      boundingbox: [min - 1, 1.5, max + 1, -1.5],
      axis: true,
      grid: false,
      showCopyright: false
    });

    for (var v = min; v <= max; v += step) {
      var isHighlight = highlightValues.indexOf(v) >= 0;
      nlBoard.create('point', [v, 0], {
        size: isHighlight ? 8 : 5,
        color: isHighlight ? '#FF4136' : '#111',
        face: isHighlight ? 'o' : 'o'
      });
      nlBoard.create('text', [v, -0.6, String(v)], { anchorX: 'middle', fontSize: 10 });
    }

    if (title) {
      nlBoard.create('text', [min + 0.3, 1.2, title], { fontSize: 12, color: '#555' });
    }

    if (window.ResizeObserver) {
      new ResizeObserver(reportHeight).observe(container);
    }
  }

  function parseBounds(str) {
    var parts = str.split(',').map(Number);
    if (parts.length === 4 && parts.every(function(n) { return !isNaN(n); })) {
      return parts;
    }
    return [-10, 10, -10, 10];
  }
})();
</script>
</body>
</html>
